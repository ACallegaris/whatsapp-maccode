openapi: 3.0.3
info:
  title: Taskio WhatsApp API
  version: 1.0.0
  description: |
    API de WhatsApp do Taskio para integração com outros sistemas.
    Autentique com `Authorization: Bearer sk-taskio-...` (chave gerada no Taskio, válida para uma organização).
  license:
    name: MIT
servers:
  - url: https://wa.sistemataskio.com.br
security:
  - apiKey: []

tags:
  - name: Envio
  - name: Conversas
  - name: Contatos e grupos
  - name: Agendamentos

paths:
  /api/whatsapp/send:
    post:
      tags: [Envio]
      summary: Envia mensagem de texto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, text]
              properties:
                orgId: { $ref: '#/components/schemas/OrgId' }
                phone: { $ref: '#/components/schemas/Destino' }
                conversationId:
                  type: string
                  description: Conversa existente do Taskio. Se informado, a mensagem é gravada no histórico dela.
                text: { type: string, example: 'Olá! Seu pedido saiu para entrega.' }
                campaignId: { type: string, description: Identificador livre para agrupar envios no histórico }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/whatsapp/send-media:
    post:
      tags: [Envio]
      summary: Envia imagem, documento, áudio ou vídeo
      description: Aceita JSON com `mediaBase64` ou multipart com o arquivo no campo `file` (até 50 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MediaFields'
                - type: object
                  required: [mediaBase64]
                  properties:
                    mediaBase64:
                      type: string
                      description: Data URL (`data:<mime>;base64,<dados>`)
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/MediaFields'
                - type: object
                  required: [file]
                  properties:
                    file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/whatsapp/conversations/{orgId}:
    get:
      tags: [Conversas]
      summary: Lista as conversas mais recentes
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Conversas ordenadas pela última atualização
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversa' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/whatsapp/messages/{conversationId}:
    get:
      tags: [Conversas]
      summary: Lista as mensagens de uma conversa
      description: Retorna até 200 mensagens em ordem cronológica e zera o contador de não lidas.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Mensagens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mensagem' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/whatsapp/media/{orgId}/{messageId}:
    get:
      tags: [Conversas]
      summary: Baixa a mídia de uma mensagem
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conteúdo binário do arquivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302': { description: Redireciona para a URL do arquivo armazenado }
        '404': { $ref: '#/components/responses/Error' }

  /api/whatsapp/contacts/{orgId}:
    get:
      tags: [Contatos e grupos]
      summary: Agenda do número conectado
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Contatos
          content:
            application/json:
              schema:
                type: object
                properties:
                  contatos:
                    type: array
                    items: { $ref: '#/components/schemas/Contato' }
                  conectado: { type: boolean }

  /api/whatsapp/contacts/{orgId}/sync:
    post:
      tags: [Contatos e grupos]
      summary: Força a sincronização da agenda
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Contatos atualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  contatos:
                    type: array
                    items: { $ref: '#/components/schemas/Contato' }

  /api/whatsapp/groups/{orgId}:
    get:
      tags: [Contatos e grupos]
      summary: Grupos de que o número participa
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: force
          in: query
          description: '`1` ignora o cache do servidor'
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Grupos
          content:
            application/json:
              schema:
                type: object
                properties:
                  grupos:
                    type: array
                    items: { $ref: '#/components/schemas/Grupo' }

  /api/whatsapp/campanhas/{orgId}:
    get:
      tags: [Envio]
      summary: Histórico de envios avulsos (sem conversa)
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Até 500 envios, mais recentes primeiro
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id: { type: string }
                    tipo: { type: string, enum: [broadcast, broadcast_midia] }
                    texto: { type: string }
                    destinatario: { type: string }
                    campaignId: { type: string, nullable: true }
                    timestamp: { type: string, format: date-time }
                    status: { type: string }

  /api/whatsapp/agendamentos/{orgId}:
    get:
      tags: [Agendamentos]
      summary: Lista agendamentos
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Até 300 agendamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agendamento' }
    post:
      tags: [Agendamentos]
      summary: Cria um agendamento
      description: |
        JSON (só texto) ou multipart com o anexo em `file` e os dados (JSON) no campo `payload`.
        Os envios são espaçados automaticamente entre destinatários.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoAgendamento' }
          multipart/form-data:
            schema:
              type: object
              required: [payload, file]
              properties:
                payload:
                  type: string
                  description: JSON de NovoAgendamento
                file: { type: string, format: binary }
      responses:
        '200':
          description: Agendamento criado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Agendamento'
                  - type: object
                    properties:
                      success: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }

  /api/whatsapp/agendamentos/{orgId}/{id}/cancelar:
    post:
      tags: [Agendamentos]
      summary: Cancela um agendamento pendente
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AgendamentoId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/whatsapp/agendamentos/{orgId}/{id}:
    delete:
      tags: [Agendamentos]
      summary: Exclui um agendamento (não pode estar pendente nem enviando)
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AgendamentoId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Chave `sk-taskio-...`

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrgId' }
    AgendamentoId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
    Error:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  schemas:
    OrgId:
      type: string
      example: ORG-123456
    Destino:
      type: string
      description: |
        Telefone (BR com 10/11 dígitos recebe DDI 55), JID de grupo (`...@g.us`) ou contato LID (`...@lid`).
        Obrigatório quando não há `conversationId`.
      example: '11999998888'
    MediaFields:
      type: object
      required: [orgId, mediaType]
      properties:
        orgId: { $ref: '#/components/schemas/OrgId' }
        phone: { $ref: '#/components/schemas/Destino' }
        conversationId: { type: string }
        mediaType: { type: string, enum: [image, document, audio, video] }
        mimeType: { type: string, example: application/pdf }
        fileName: { type: string, example: boleto.pdf }
        caption: { type: string }
        campaignId: { type: string }
    Conversa:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        organizationId: { type: string }
        telefone: { type: string }
        whatsappChatId: { type: string }
        ultimaMensagem: { type: string }
        mensagensNaoLidas: { type: integer }
        updatedAt: { type: string, format: date-time }
    Mensagem:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        conversationId: { type: string }
        remetente: { type: string, description: '`cliente`, `operador`, `bot`...' }
        texto: { type: string }
        tipo: { type: string, example: text }
        fileName: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    Contato:
      type: object
      properties:
        phone: { type: string }
        nome: { type: string }
        salvo: { type: boolean, description: Contato salvo na agenda do aparelho }
    Grupo:
      type: object
      properties:
        id: { type: string, example: '120363000000000000@g.us' }
        nome: { type: string }
        participantes: { type: integer }
        somenteAdmins: { type: boolean, description: Só administradores podem enviar }
        souAdmin: { type: boolean }
    Destinatario:
      type: object
      required: [id]
      properties:
        id: { type: string, description: 'Telefone, `...@g.us` ou `...@lid`' }
        nome: { type: string }
        tipo: { type: string, enum: [numero, contato, cliente, grupo], default: numero }
    NovoAgendamento:
      type: object
      required: [agendadoPara, destinatarios]
      properties:
        texto: { type: string, description: Obrigatório se não houver anexo }
        agendadoPara: { type: string, format: date-time }
        destinatarios:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Destinatario' }
    Agendamento:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        organizationId: { type: string }
        texto: { type: string }
        agendadoPara: { type: string, format: date-time }
        destinatarios:
          type: array
          items: { $ref: '#/components/schemas/Destinatario' }
        midia:
          type: object
          nullable: true
          properties:
            mimeType: { type: string }
            fileName: { type: string }
            mediaType: { type: string, enum: [image, document, audio, video] }
        status: { type: string, enum: [pendente, enviando, enviado, parcial, falhou, cancelado] }
        resultados:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              nome: { type: string }
              ok: { type: boolean }
              erro: { type: string }
        enviados: { type: integer }
        falhas: { type: integer }
        createdAt: { type: string, format: date-time }
        finalizadoEm: { type: string, format: date-time }
